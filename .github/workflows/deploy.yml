# Test and deploy Britto
#
# Every push and pull request: typecheck (both configs), the unit tests and the reader check.
# Every push to `main`: then the D1 schema, THEN the Worker (the order is load-bearing: new code
# must never meet a database without its tables), then the live end-to-end check.
#
# One repository secret (Settings → Secrets and variables → Actions), added by the owner:
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" template + D1 Edit, AMITY account only
# Until it exists the deploy job says so and skips; tests still run.
# The account id is not a secret: it is in wrangler.jsonc.

name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # node --test strips types without checking them: tsc is the real gate.
      - run: npm run typecheck
      - run: npm test
      # Config CI (BLUEPRINT §22): every reader config valid, every saved page reads as expected.
      - run: npm run check:readers

  # The Android app: its unit tests (Robolectric) and a release APK, kept as a download on the
  # run's page (Actions -> the run -> Artifacts -> britto-apk). Signed with the runner's own
  # debug key until the owner adds a release key (HISTORY.md, "Waiting for the owner"), so an
  # APK from one run cannot update an app installed from another run's APK.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # With the owner's release key (two repository secrets, see HISTORY.md "Waiting for the
      # owner"), every APK can update the one installed before it. Without, a debug key.
      - name: Release key, if the owner has added one
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/britto.keystore"
            echo "BRITTO_KEYSTORE=$RUNNER_TEMP/britto.keystore" >> "$GITHUB_ENV"
            echo "BRITTO_KEYSTORE_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "::notice title=APK signed with a debug key::No ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS secrets yet."
          fi
      - name: Unit tests and the release APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: britto-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never two deploys at once, and never cancel one halfway through a rollout.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Is the Cloudflare token set?
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Deploy skipped::No CLOUDFLARE_API_TOKEN repository secret yet. Tests ran; nothing was deployed."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Database schema first (idempotent)
        if: steps.token.outputs.ready == 'yes'
        run: npx wrangler d1 execute britto --remote --file=api/schema.sql
      - name: Then the Worker
        if: steps.token.outputs.ready == 'yes'
        run: npx wrangler deploy
      # Read-mostly: re-opens two already-tracked products and checks refusals; adds no products
      # (only short-lived rate-limit counters).
      - name: Live check
        if: steps.token.outputs.ready == 'yes'
        run: node scripts/prove.mjs --live https://britto.amitynoidalibrary.workers.dev
